[package]
name = "effitask"
version = "0.1.0"
authors = ["Sanpi <sanpi@homecomputing.fr>"]
homepage = "https://github.com/todotxt-rs/effitask"
edition = "2024"

[dependencies]
human-panic = "2.0"
jiff = "1.0"
notify = "8.0"
pulldown-cmark = "0.13"
regex = "1.0"
relm4 = "0.11"
smol = "2.0"

[dependencies.envir]
version = "1.2"
default-features = false
features = ["dotenv"]

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_8"]

[dependencies.log]
version = "0.4"
features = ["std"]

[dependencies.todo-txt]
version = "5.0"
features = ["config", "extended"]

[build-dependencies]
glib-build-tools = "0.22"
